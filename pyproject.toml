[project]
name = "melochron"
version = "0.1.0"
description = "Adoption prediction: will a listener return to a track they just met?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# torch is an extra, not a base dependency, so the index can differ by
# environment: training installs the CUDA build explicitly, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
train = [
    "torch>=2.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["melochron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
